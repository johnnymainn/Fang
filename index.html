<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FANG DYNAMICS</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: white;
            background: linear-gradient(to bottom right, #000000, #1a1a4d);
            overflow-x: hidden;
            position: relative;
        }

        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 20px;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: space-around;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .navbar a {
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            transition: all 0.3s ease;
            border-bottom: 2px solid transparent;
        }

        .navbar a:hover {
            border-bottom: 2px solid white;
        }

        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            position: relative;
            z-index: 1;
            padding: 100px 20px 50px;
        }

        .hero h1 {
            font-size: 4rem;
            margin: 0;
            letter-spacing: 10px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        .hero p {
            font-size: 1.5rem;
            margin: 20px 0;
            opacity: 0.9;
        }

        .hero img {
            width: 60%;
            max-width: 800px;
            margin-top: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .contact {
            background: rgba(0, 0, 0, 0.8);
            padding: 60px 40px;
            text-align: center;
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .contact h2 {
            font-size: 3rem;
            margin-bottom: 20px;
            letter-spacing: 5px;
        }

        .contact p {
            font-size: 1.2rem;
            margin-bottom: 40px;
            opacity: 0.8;
        }

        .contact form {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .contact input,
        .contact textarea {
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            font-size: 1rem;
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        .contact input::placeholder,
        .contact textarea::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .contact input:focus,
        .contact textarea:focus {
            outline: none;
            border-color: white;
            background: rgba(255, 255, 255, 0.15);
        }

        .contact textarea {
            min-height: 150px;
            resize: vertical;
        }

        .contact button {
            padding: 15px 40px;
            background: white;
            color: #000;
            border: none;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .contact button:hover {
            background: #ddd;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 255, 255, 0.3);
        }

        /* Grid effect */
        .grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.1) 0.5px, transparent 0.5px),
                              repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.1) 0.5px, transparent 0.5px);
            background-size: 20px 20px;
            pointer-events: none;
            transform: translateZ(0);
            will-change: transform;
            z-index: 0;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2.5rem;
                letter-spacing: 5px;
            }

            .hero p {
                font-size: 1.2rem;
            }

            .hero img {
                width: 90%;
            }

            .contact h2 {
                font-size: 2rem;
            }

            .navbar {
                padding: 15px;
            }

            .navbar a {
                padding: 8px 15px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="grid"></div>
    <nav class="navbar">
        <a href="#home">Home</a>
        <a href="#contact">Contact</a>
    </nav>

    <section class="hero" id="home">
        <h1>FANG DYNAMICS</h1>
        <p>Setting the standard for motorsport innovation.</p>
        <img src="car-image.jpg" alt="Racing Car">
    </section>

    <section class="contact" id="contact">
        <h2>Contact Us</h2>
        <p>For inquiries, please reach out to us.</p>
        <form>
            <input type="text" placeholder="Your Name" required>
            <input type="email" placeholder="Your Email" required>
            <textarea placeholder="Your Message" required></textarea>
            <button type="submit">Send Message</button>
        </form>
    </section>

    <script>
        const grid = document.querySelector('.grid');
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth * 2);
            const y = (e.clientY / window.innerHeight * 2);
            grid.style.transform = `translate(-${x}px, -${y}px)`;
        });

        // Smooth scrolling for navigation links
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                }
            });
        });
    </script>
</body>
</html>
